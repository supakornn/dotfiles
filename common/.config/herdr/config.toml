onboarding = false
[keys]
prefix = "ctrl+a"
split_vertical = "prefix+|"
detach = "prefix+d"
previous_workspace = "prefix+("
next_workspace = "prefix+)"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

# Keep Latte unmodified in light mode; use the preferred Macchiato overrides in dark mode.
[theme.custom.dark]
accent = "#c6a0f6"
panel_bg = "#24273a"
green = "#a6da95"
yellow = "#eed49f"
red = "#ed8796"
blue = "#8aadf4"

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"

[terminal]
# Executable used for new interactive panes. Empty uses $SHELL, then /bin/sh.
# Default: "".
default_shell = "fish"


[ui.sound]
enabled = false
