#!/bin/sh
# Change only the theme; preserve all other machine-local btop preferences.
awk '
BEGIN { found = 0 }
/^[[:space:]]*color_theme[[:space:]]*=/ {
    if (!found++) print "color_theme = \"catppuccin_mocha\""
    next
}
{ print }
END { if (!found) print "color_theme = \"catppuccin_mocha\"" }
'
